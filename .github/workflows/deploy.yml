name: Deploy to GitHub Pages

# on:push is kept deliberately even though it does not currently fire —
# see README, "Why a plain git push does not deploy". It costs nothing and
# resumes working by itself if GitHub's side ever changes.
on:
  push:
    branches: [master]
  workflow_dispatch:

# Allow GITHUB_TOKEN to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel a run that's mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Catches broken content-collection references and bad component props
      # before they reach the published site. Currently clean, so any failure
      # here is a real regression.
      - run: npm run check

      - run: npm run build

      # The custom domain lives in public/CNAME and must reach dist/.
      # If it ever goes missing the site falls back to klecoz.github.io.
      - name: Verify CNAME survived the build
        run: |
          test -f dist/CNAME || { echo "::error::dist/CNAME missing — custom domain would break"; exit 1; }
          grep -qx 'arseniocolon.com' dist/CNAME || { echo "::error::dist/CNAME has unexpected contents"; exit 1; }
          echo "CNAME ok: $(cat dist/CNAME)"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
